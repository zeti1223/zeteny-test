<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Háttér -->
  <rect width="512" height="512" rx="80" fill="#1877f2"/>
  
  <!-- Chat buborék 1 (bal felső) -->
  <ellipse cx="180" cy="200" rx="80" ry="70" fill="#ffffff" opacity="0.9"/>
  
  <!-- Chat buborék 2 (jobb felső) -->
  <ellipse cx="340" cy="180" rx="70" ry="65" fill="#ffffff" opacity="0.95"/>
  
  <!-- Chat buborék 3 (középső) -->
  <ellipse cx="260" cy="280" rx="90" ry="75" fill="#ffffff"/>
  
  <!-- Chat buborék 4 (alsó) -->
  <ellipse cx="160" cy="350" rx="60" ry="55" fill="#ffffff" opacity="0.85"/>
  
  <!-- Vonalak a buborékokban (chat üzenetek jelzése) -->
  <line x1="140" y1="200" x2="220" y2="200" stroke="#1877f2" stroke-width="8" stroke-linecap="round"/>
  <line x1="150" y1="220" x2="200" y2="220" stroke="#1877f2" stroke-width="6" stroke-linecap="round"/>
  
  <line x1="290" y1="180" x2="360" y2="180" stroke="#1877f2" stroke-width="8" stroke-linecap="round"/>
  <line x1="300" y1="200" x2="350" y2="200" stroke="#1877f2" stroke-width="6" stroke-linecap="round"/>
  
  <line x1="200" y1="280" x2="320" y2="280" stroke="#1877f2" stroke-width="10" stroke-linecap="round"/>
  <line x1="210" y1="300" x2="310" y2="300" stroke="#1877f2" stroke-width="8" stroke-linecap="round"/>
  <line x1="220" y1="320" x2="280" y2="320" stroke="#1877f2" stroke-width="6" stroke-linecap="round"/>
</svg>

